<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>《玫瑰不向深渊折》· 专属追更小筑</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f1015;
      --bg-surface: #181920;
      --bg-card: #20222b;
      --text-primary: #f0f0f5;
      --text-secondary: #9ea3b5;
      --text-muted: #676c82;
      --accent: #ff4d79;
      --accent-glow: rgba(255, 77, 121, 0.25);
      --accent-gold: #f4c06a;
      --border: rgba(255, 255, 255, 0.08);
      --font-body: 'Noto Serif SC', 'Songti SC', 'Source Han Serif SC', serif;
      --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-size: 18px;
      --line-height: 1.95;
    }

    /* 浅色主题 (晨光粉黛 / 柔光象牙) */
    body[data-theme="light"] {
      --bg-primary: #fff8fa;
      --bg-surface: #faedf1;
      --bg-card: #ffffff;
      --text-primary: #281920;
      --text-secondary: #664f58;
      --text-muted: #96828b;
      --accent: #e53865;
      --accent-glow: rgba(229, 56, 101, 0.2);
      --accent-gold: #b3820a;
      --border: rgba(229, 56, 101, 0.12);
    }

    /* 柔光羊皮纸 */
    body[data-theme="parchment"] {
      --bg-primary: #f6f1e5;
      --bg-surface: #ede5d5;
      --bg-card: #fbf7ee;
      --text-primary: #2b251e;
      --text-secondary: #635748;
      --text-muted: #8c7e6c;
      --accent: #b25828;
      --accent-glow: rgba(178, 88, 40, 0.2);
      --accent-gold: #a67c1e;
      --border: rgba(100, 70, 40, 0.12);
    }

    /* 纯净极简白 */
    body[data-theme="ivory"] {
      --bg-primary: #ffffff;
      --bg-surface: #f7f8fa;
      --bg-card: #f0f2f5;
      --text-primary: #1a1a1a;
      --text-secondary: #555555;
      --text-muted: #888888;
      --accent: #2c5ae9;
      --accent-glow: rgba(44, 90, 233, 0.2);
      --accent-gold: #c59325;
      --border: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* 顶部阅读进度条 */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-gold));
      width: 0%;
      z-index: 1000;
      transition: width 0.1s ease;
    }

    /* 顶部导航栏 */
    .top-nav {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      background: var(--bg-primary);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 99;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    .nav-brand span.rose-icon {
      color: var(--accent);
      font-size: 18px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 独立快速深色/浅色切换药丸按钮 */
    .quick-mode-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
    }

    .quick-mode-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: scale(1.03);
    }

    .btn-icon {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-family: var(--font-sans);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* 容器 */
    .container {
      max-width: 740px;
      margin: 0 auto;
      padding: 20px 20px 80px;
    }

    /* 顶部专属情侣横幅 */
    .hero-banner {
      background: linear-gradient(145deg, var(--bg-surface), var(--bg-card));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    .hero-banner::after {
      content: "🌹";
      position: absolute;
      right: -15px;
      bottom: -20px;
      font-size: 110px;
      opacity: 0.08;
      pointer-events: none;
    }

    .badge-sweet {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-glow);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 12px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .hero-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
      background: linear-gradient(120deg, var(--text-primary), var(--accent-gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-sub {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .love-note {
      border-top: 1px dashed var(--border);
      padding-top: 12px;
      font-family: var(--font-sans);
      font-size: 12.5px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 角色横向滚动条 */
    .cast-bar-title {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cast-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 30px;
      scrollbar-width: none;
    }

    .cast-scroll::-webkit-scrollbar {
      display: none;
    }

    .cast-chip {
      flex: 0 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cast-chip:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .cast-avatar {
      font-size: 22px;
    }

    .cast-info .name {
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .cast-info .tag {
      font-family: var(--font-sans);
      font-size: 11px;
      color: var(--text-muted);
    }

    /* 正文区 */
    .article-header {
      margin-bottom: 32px;
      text-align: center;
    }

    .chapter-number {
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .chapter-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .chapter-meta {
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--text-muted);
    }

    .article-content {
      font-size: var(--font-size);
      line-height: var(--line-height);
      letter-spacing: 0.3px;
      min-height: 400px;
    }

    .article-content p {
      margin-bottom: 24px;
      text-indent: 2em;
      text-align: justify;
    }

    .article-content p.first-p {
      text-indent: 0;
    }

    .article-content p.first-p::first-letter {
      float: left;
      font-size: 44px;
      line-height: 40px;
      padding-top: 4px;
      padding-right: 8px;
      padding-bottom: 0px;
      color: var(--accent);
      font-family: var(--font-sans);
      font-weight: 700;
    }

    /* 章节尾声与互动 */
    .chapter-end {
      margin-top: 50px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .interactive-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
    }

    .btn-heart {
      background: linear-gradient(135deg, var(--accent), #ff758c);
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 20px var(--accent-glow);
      transition: all 0.2s ease;
    }

    .btn-heart:active {
      transform: scale(0.95);
    }

    .heart-count {
      background: rgba(0, 0, 0, 0.2);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
    }

    .feedback-msg {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--accent);
      margin-top: 14px;
      min-height: 20px;
    }

    /* 底部翻页栏 */
    .chapter-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .nav-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 14px;
      border-radius: 12px;
      font-family: var(--font-sans);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .nav-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .nav-btn span.label {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* 抽屉 */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }

    .drawer-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      max-height: 82vh;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      padding: 24px 20px 40px;
      z-index: 1001;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .drawer.active {
      transform: translateY(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .drawer-title {
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 700;
    }

    .drawer-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
    }

    .drawer-content {
      overflow-y: auto;
      flex: 1;
    }

    /* 目录列表项 */
    .catalog-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 12px;
      border-radius: 10px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      font-family: var(--font-sans);
      transition: background 0.2s ease;
    }

    .catalog-item:hover {
      background: var(--bg-card);
    }

    .catalog-item.active {
      color: var(--accent);
      font-weight: 700;
      background: var(--accent-glow);
    }

    .catalog-item .c-title {
      font-size: 14px;
    }

    .catalog-item .c-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--bg-primary);
      color: var(--text-muted);
    }

    .catalog-item.ready .c-badge {
      background: var(--accent-glow);
      color: var(--accent);
      font-weight: 600;
    }

    /* 设置选项 */
    .settings-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      font-family: var(--font-sans);
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .settings-label {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .theme-picker {
      display: flex;
      gap: 8px;
    }

    .theme-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s ease;
    }

    .theme-dot.active {
      border-color: var(--accent);
      transform: scale(1.1);
    }

    .font-btn-group {
      display: flex;
      gap: 6px;
    }

    .font-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    /* 飘心 */
    .floating-heart {
      position: fixed;
      font-size: 24px;
      pointer-events: none;
      animation: flyUp 1.2s ease-out forwards;
      z-index: 9999;
    }

    @keyframes flyUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(0.8) rotate(0deg);
      }
      50% {
        opacity: 0.9;
        transform: translateY(-80px) scale(1.3) rotate(-15deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-160px) scale(1) rotate(15deg);
      }
    }
  </style>
</head>
<body data-theme="dark">
  <div id="progress-bar"></div>

  <!-- 顶部导航 -->
  <header class="top-nav">
    <div class="nav-brand">
      <span class="rose-icon">🌹</span>
      <span>玫瑰不向深渊折</span>
    </div>
    <div class="nav-actions">
      <!-- 快捷深浅色切换按钮 -->
      <button class="quick-mode-btn" id="btn-quick-theme" onclick="toggleDarkLight()" title="切换浅色/深色">
        <span id="quick-theme-icon">☀️</span>
        <span id="quick-theme-text">浅色</span>
      </button>

      <button class="btn-icon" onclick="openDrawer('cast-drawer')">
        <span>👥</span> 人物
      </button>
      <button class="btn-icon" onclick="openDrawer('catalog-drawer')">
        <span>📖</span> 目录
      </button>
      <button class="btn-icon" onclick="openDrawer('settings-drawer')">
        <span>⚙️</span>
      </button>
    </div>
  </header>

  <main class="container">
    <!-- 专属情侣横幅 -->
    <div class="hero-banner">
      <div class="badge-sweet">💖 专属于小仙女的追更小筑 · 独家连载</div>
      <h1 class="hero-title">玫瑰不向深渊折</h1>
      <p class="hero-sub">“当断则断，自立豪门；深渊万丈，回首已是众神之巅。”</p>
      <div class="love-note">
        <span>💌</span>
        <span>作者寄语：这是专门为你写的故事。每晚睡前，记得来看更新呀～</span>
      </div>
    </div>

    <!-- 角色小卡片快速浏览 -->
    <div class="cast-bar-title">
      <span>主要角色档案（点击查看人设）</span>
      <span style="font-size: 12px; color: var(--accent); cursor: pointer;" onclick="openDrawer('cast-drawer')">全部 9 位 ›</span>
    </div>
    <div class="cast-scroll" id="cast-chips-container"></div>

    <!-- 正文展示区 -->
    <article class="article-box">
      <header class="article-header">
        <div class="chapter-number" id="cur-chapter-badge">CHAPTER 01</div>
        <h2 class="chapter-title" id="cur-chapter-title">第001章 碎裂的威士忌</h2>
        <div class="chapter-meta" id="cur-chapter-meta">字数：3,799 字 · 更新状态：已落盘</div>
      </header>

      <section class="article-content" id="article-body"></section>
    </article>

    <!-- 章节结尾互动与催更 -->
    <footer class="chapter-end">
      <div class="interactive-card">
        <button class="btn-heart" id="btn-heart" onclick="triggerHeart(event)">
          <span>❤️</span>
          <span>戳作者催更 / 投喂小心心</span>
          <span class="heart-count" id="heart-count">1314</span>
        </button>
        <div class="feedback-msg" id="feedback-msg">点击爱心，把你的夸奖直接送达作者哦～</div>
      </div>

      <!-- 翻页导航 -->
      <nav class="chapter-nav">
        <button class="nav-btn" id="btn-prev-chap" onclick="prevChapter()">
          <span class="label">上一章</span>
          <span id="prev-chap-title">前面没有啦</span>
        </button>
        <button class="nav-btn" id="btn-next-chap" onclick="nextChapter()">
          <span class="label">下一章</span>
          <span id="next-chap-title">第002章 清空退路 ›</span>
        </button>
      </nav>
    </footer>
  </main>

  <!-- 抽屉遮罩 -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="closeAllDrawers()"></div>

  <!-- 目录抽屉 -->
  <div class="drawer" id="catalog-drawer">
    <div class="drawer-header">
      <div class="drawer-title">全书目录（共 100 章）</div>
      <button class="drawer-close" onclick="closeAllDrawers()">✕</button>
    </div>
    <div class="drawer-content" id="catalog-list"></div>
  </div>

  <!-- 人物库抽屉 -->
  <div class="drawer" id="cast-drawer">
    <div class="drawer-header">
      <div class="drawer-title">主要人物矩阵与关系谱</div>
      <button class="drawer-close" onclick="closeAllDrawers()">✕</button>
    </div>
    <div class="drawer-content" id="cast-detail-list" style="display: flex; flex-direction: column; gap: 14px;"></div>
  </div>

  <!-- 阅读设置抽屉 -->
  <div class="drawer" id="settings-drawer">
    <div class="drawer-header">
      <div class="drawer-title">个性化阅读设置</div>
      <button class="drawer-close" onclick="closeAllDrawers()">✕</button>
    </div>
    <div class="drawer-content">
      <div class="settings-grid">
        <div class="settings-row">
          <span class="settings-label">背景主题</span>
          <div class="theme-picker">
            <div class="theme-dot active" style="background: #0f1015;" onclick="setTheme('dark')" title="暗夜黑金"></div>
            <div class="theme-dot" style="background: #fff8fa;" onclick="setTheme('light')" title="晨光粉黛（浅色）"></div>
            <div class="theme-dot" style="background: #f6f1e5;" onclick="setTheme('parchment')" title="柔光羊皮（护眼）"></div>
            <div class="theme-dot" style="background: #ffffff;" onclick="setTheme('ivory')" title="纯净象牙（极简）"></div>
          </div>
        </div>

        <div class="settings-row">
          <span class="settings-label">字号调节</span>
          <div class="font-btn-group">
            <button class="font-btn" onclick="changeFontSize(-1)">A -</button>
            <span id="font-size-val" style="padding: 6px 10px; font-size: 13px;">18px</span>
            <button class="font-btn" onclick="changeFontSize(1)">A +</button>
          </div>
        </div>

        <div class="settings-row">
          <span class="settings-label">字体风格</span>
          <div class="font-btn-group">
            <button class="font-btn" onclick="setFontFamily('serif')">古典宋体</button>
            <button class="font-btn" onclick="setFontFamily('sans')">现代黑体</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 章节数据与全书目录注入
    const CHAPTERS = [{"num": 1, "title": "第001章 碎裂的威士忌", "paragraphs": ["A市入秋后的第一场冷雨，将整座城市的霓虹洗刷得格外刺眼。", "夜色深沉，位于沿江核心商圈顶层的「浮光」清吧内，萨克斯悠扬低沉的曲调在冷光灯影中流淌。水晶吊灯折射出幽蓝与暗金交织的光斑，空气中弥漫着陈年雪松香与雪利桶威士忌的醇厚气息。", "厚重的隔音琉璃门被无声推开，夹杂着秋夜雨丝的凉意随之涌入。", "温见雪收起手中的黑色长柄雨伞，将风衣领口微湿的水珠随手拂落。她生了一张极清艳的脸，眉骨生得高挺而秀致，眼眸如初春未融的薄冰，清冷、明澈，未施粉黛却自带一种拒人于千里之外的凛然风骨。", "身旁，踩着七厘米红底细高跟的林晚晚抖了抖皮草外套，压低了嗓音，语气里带着毫不掩饰的火药味：“见雪，你确定那渣子真在这儿？半小时前他不是还在微信上跟你装孙子，说自己在给城南项目的大客户通宵改图纸吗？”", "“他的车停在地下二层B区。”温见雪的语调平静得没有一丝波澜，修长白皙的指节微微收紧伞柄，“迈巴赫右侧后视镜上挂着的红珊瑚平安结，是我上个月去九华山亲手求的。”", "林晚晚冷笑一声，眼底满是狠戾：“行，今天要是真让我抓个现行，老娘非把他那张虚伪的皮给扒下来不可。”", "温见雪没有接话。她迈开步子，高跟鞋在深色橡木地板上踩出沉稳而克制的节奏。", "大学四年，毕业三年，整整七年的光阴，三年的情侣名分。", "在大学校园里，沈淮安曾是建筑系人尽皆知的才子，骑着单车穿过林荫道，在梧桐树下为她递过无数盒温热的脱脂牛奶；为了陪她赶方案，他能在画室里通宵守上三个整夜。", "毕业后，沈淮安削尖了脑袋想要挤进A市最顶层的权贵圈子。沈家在A市不过是个勉强排得上号的旁支末流，为了巴结上真正的豪门巨擘，沈淮安常年游走在各色纸醉金迷的酒局边缘，极尽逢迎讨好。", "温见雪体谅他的野心与不易，无数个深夜独自在工作室替他推演方案、重构空间受力模型，甚至帮他拿下了数个让沈氏家族长辈刮目相看的千万级大单。", "沈淮安曾当着所有朋友的面单膝跪地，信誓旦旦地说，温见雪是他此生唯一的救赎与缪斯。", "然而，所谓坚不可摧的深情，在名利场浮华的欲望面前，脆弱得宛如一张薄纸。", "穿过主吧台那座高达六米的发光酒架，视线豁然开朗。", "在正对着落地全景玻璃幕墙的半开放式VIP卡座里，几道熟悉的身影赫然撞入视线。", "沈淮安身上那件定制西装的领带早已被扯得歪斜，衬衫领口敞开两颗纽扣，脸上带着微醺的潮红。", "而在他的怀里，紧紧依偎着一个身穿浅粉色抹胸鱼尾裙的女人——宋芊芊。", "正是温见雪的大学同班同学。", "宋芊芊整个人宛若无骨般倚靠在沈淮安怀中，涂着猩红蔻丹的纤细手指正捏着一颗剥好的青提，娇笑着递到男人嘴边：“淮安，张嘴嘛……你不是答应过我，下个月城东那个滨湖艺术馆的软装采购全权交给我名下的工作室么？见雪要是知道了，会不会吃醋找你闹呀？”", "沈淮安就着她的手将青提咬入口中，唇瓣甚至放肆地贴着女人的指尖蹭了蹭，喉咙里溢出一声低哑轻佻的笑：", "“提她做什么？坏了兴致。”", "沈淮安晃动着手里的威士忌酒杯，语气中带着几分自矜与不屑：“见雪那性子你又不是不知道，成天冷得像块万年不化的冰疙瘩。谈恋爱三年，连碰都不让我多碰一下，古板无趣透顶！要不是看在她设计天赋过人、画图还能派上大用场的份上，我早受够她那副高高在上的大小姐做派了。”", "宋芊芊掩唇娇笑，眼底闪烁着得逞后的快意与恶毒：“原来你心里是这么想的呀……我还以为你真把她当成供在神坛上的仙女呢。”", "“仙女能当饭吃？男人在外面打拼，要的是懂情调、知冷知热的解语花，可不是找个祖宗来供着！”沈淮安冷哼一声，伸手便顺着宋芊芊裸露的香肩一路滑下，轻浮地捏住女人的下巴，“今天这局可是我好不容易托人搭上的线，等楼上那两位贵人尽了兴，沈家在城南的项目就能彻底盘活。今晚……你得好好陪我。”", "“讨厌……你坏死了……”", "宋芊芊娇嗔着将脸埋进沈淮安颈窝，眼角余光不经意间一扫，整个人却骤然僵住。", "原本挂在她唇边的得意娇笑，在看清数步之外那道清绝孤拔的玄色身影时，瞬间寸寸凝固成惊恐。", "温见雪就站在两米开外的阴影边缘。", "那一身黑色的剪裁风衣衬得她身姿清瘦挺拔，面容沉静得听不到一丝呼吸声，仿佛眼前这出不堪入目的丑剧，只是戏台上滑稽的一出折子戏。", "林晚晚眼底的火几乎要喷出来，咬牙切齿便要冲上去扇人，却被温见雪抬手轻轻拦住。", "“见雪……”林晚晚胸口剧烈起伏。", "“不急。”温见雪的声音很轻，却透着一股叫人骨髓生寒的凉。", "恰逢一名侍应生端着银质托盘穿行而过，托盘中央摆着一杯刚加满大方老冰的单一麦芽威士忌，琥珀色的液体在冷光下折射出冰冷刺骨的光晕。", "温见雪抬起素白如玉的右手，优雅而利落地取下了那杯酒。", "高跟鞋的声音很轻，却仿佛精准地踏在了心脏跳动的节律上。", "沈淮安察觉到怀中女人的异样，不耐烦地皱眉：“芊芊，怎么了？见鬼了？”", "他一边漫不经心地转过头，一边端起自己的酒杯，然而下一秒，视野被一道扑面而来的冰冷液体彻底淹没！", "哗啦——！", "满满一杯掺杂着碎冰渣的烈性威士忌，毫无预兆、兜头盖脸地泼在了沈淮安精心打理的发丝与面孔上！", "刺鼻浓烈的酒精瞬间钻入眼睛和鼻腔，冰冷的液体顺着发梢、鼻梁、下颌狼狈滴落，将他昂贵的高定衬衫彻底浸透成一团脏污的抹布。", "“操！哪个不长眼的……”", "沈淮安发出凄厉的呛咳与怒吼，狼狈地胡乱抹着眼睛，猛地从真皮沙发上弹跳起来。", "然而，当他终于看清逆光而立的温见雪时，喉咙里所有的咒骂仿佛被一双无形的大手硬生生掐断，整张脸由红转白，又由白转青，煞白如纸。", "“见……见雪？！”", "原本依偎在卡座里的宋芊芊也吓得花容失色，尖叫着缩在角落里，连头都不敢抬。", "温见雪指尖空悬着那只雕花水晶酒杯，垂眸看着眼前宛如落水野狗般的男人，眼神里没有愤怒，没有歇斯底里，甚至连一丝怨怼都找不到。", "只有极致的平静，以及居高临下的厌恶与漠然。", "“古板无趣？不解风情？”", "温见雪唇角微微勾起一抹极淡的冷弧，语调不疾不徐，清脆得传遍了半个安静的清吧：“原来沈大少爷过去三年蹭我改出来的方案、用我的人脉拿项目时，也是这么嫌弃我古板的？”", "周围卡座里原本低声谈笑的客人们纷纷停下动作，惊愕地将目光聚焦过来。", "沈淮安大脑嗡的一声巨响，彻底慌了神。他试图伸手去抓温见雪的衣袖：“见雪！你听我解释！不是你想的那样！是她……是宋芊芊喝多了非要往我身上贴！我今天是来谈生意的，我心里只有你一个人啊！”", "温见雪侧身一步，冷冷避开他污浊的手掌，仿佛多被他碰一下都是对自己的玷污。", "她左手缓缓抚上右手手腕。", "那里，戴着一条细细的纯银手链，吊坠是一颗极小、甚至有些磨损的银质四叶草。", "那是大学那年沈淮安做兼职攒了两个月生活费，在校门口小礼品店买下送给她的二十岁生日礼物。三年来，温见雪从未将它摘下过。", "在沈淮安惊愕失措的目光中，温见雪面无表情地解开搭扣。", "叮当——", "一声清脆悦耳的轻响。", "那条承载了三年所有青春与誓言的银链，被她毫不留恋地抛入了残留着威士忌残液的玻璃空杯中。", "“这杯酒，敬你演技精湛，骗了我整整三年。”", "温见雪居高临下地俯视着他，字字清晰如碎冰坠地：", "“这根链子，给你换明天的胃药。”", "“沈淮安，三年青春，权当喂了狗。从这一刻起，你我一刀两断，死生不复相见。”", "“见雪！不要！你不能这样！”沈淮安彻底崩溃了，伸手就要去拉拽她的手腕。", "一旁的林晚晚早已按捺不住，上前一步狠狠一记耳光甩在沈淮安脸上，清脆响亮！", "“啪——！”", "“狗东西，拿开你的脏手！”林晚晚厉声娇斥，“再敢碰见雪一下，信不信老娘找人废了你第三条腿！”", "沈淮安被打得一个踉跄跌坐在卡座上，宋芊芊缩在一旁瑟瑟发抖，连大气都不敢喘。", "温见雪甚至没有再多施舍一个眼神给这片狼藉，她优雅转身，将风衣腰带随手系紧，步履从容地朝着酒吧大门走去。", "脊背笔直，孤傲绝决，宛如一柄斩断荆棘后寒芒毕露的出鞘利剑。", "……", "而在酒吧二楼，被悬挂的水晶珠帘半遮半掩的至尊至尊VIP包厢内。", "落地单向透视玻璃将楼下那场干脆利落、杀伐果决的分手大戏完整映照。", "皮质深灰长榻上，斜倚着一个身穿暗纹西装的年轻男人。他手中晃动着一杯昂贵的香槟，生了一副极招摇的桃花眼，嘴角噙着一抹玩世不恭的戏谑笑意。", "正是A市富豪榜位列第二的顾氏集团少东家，顾宴臣。", "“啧，有意思，真有意思。”顾宴臣仰头抿了一口香槟，挑了挑眉梢，看向身侧，“沈淮安这几年在圈子里整天炫耀他那位建筑系系花女友有多温顺、多崇拜他。没想到今天一见，脾气竟然烈成了这副模样。”", "顾宴臣啧啧称奇：“冰酒淋头，断链绝交，连眼泪都没掉一滴。这份定力和狠劲，放眼整个A市的名媛圈，我都找不出第二个来。”", "坐在他正对面的单人真皮沙发上，静静端坐着一道极其挺拔尊贵的身影。", "光线很暗，勾勒出男人刀削斧凿般凌厉冷峻的侧颜。", "男人身着一袭手工定制的纯黑西服，鼻梁上架着一副银丝半框眼镜，镜片后那一双深邃幽暗的狭长黑眸，犹如深不可测的寒潭，带着久居上位者俯瞰众生般的压迫感。", "A市权势与财富榜首，真正的翻云覆雨之人——傅氏财阀掌舵人，傅沉舟。", "从温见雪端起酒杯的那一刻起，傅沉舟修长骨感、戴着一枚墨玉扳指的右手便停下了在平板电脑上的批复。", "他的视线透过剔透的玻璃，穿越昏暗迷离的浮光掠影，一路追随着那道清瘦孤绝的黑色身影，直到她推开旋转玻璃门，步入夜色纷飞的冷雨之中。", "良久。", "傅沉舟将指间的雪茄在黑曜石烟灰缸边缘轻轻掸了掸，薄唇微启，嗓音低沉醇厚，仿佛大提琴低音弦的震颤：", "“沈淮安。”", "顾宴臣转过头：“嗯？”", "傅沉舟垂眸，金丝镜片后掠过一丝极淡、却危险至极的幽光：", "“他配不上那双眼睛。”"], "words": 3738}, {"num": 2, "title": "第002章 清空所有的退路", "paragraphs": ["夜色如墨，冰冷的秋雨砸在顶层复式公寓的落地窗上，发出沉闷的声响。", "玄关的大门“咔哒”一声反锁，将外面整座城市的冷风彻底隔绝。", "林晚晚换上拖鞋，气喘吁吁地将两箱大号加厚黑色工业垃圾袋扔在玄关地毯上，双手叉腰看着站在客厅中央的温见雪。", "“见雪，今晚真不睡了？”林晚晚看着闺蜜那张苍白却平静得可怕的脸，心疼得直叹气，“要不先洗个热水澡？老娘哪怕熬通宵，也替你把这狗男人的破烂全扔出去。”", "“不用，我自己来。”", "温见雪脱下那件微湿的黑色风衣，随手挽起丝绸衬衫的袖口，露出一截雪白纤细却充满力量感的小臂。", "整整两百平的公寓，是毕业第二年温见雪执意要租下的。这里的每一张原木长桌、每一盏包豪斯风格的吊灯、每一块羊毛地毯，甚至阳台上精心修剪的龟背竹，都是她亲自挑选并垫付了绝大部分租金布置的。", "而沈淮安，只是在当初搬进来的时候，信誓旦旦地抱住她说：“见雪，等我将来出人头地、拿到沈家核心股份，我一定买下全A市最顶级的江景大平层，风风光光娶你过门。”", "那些曾经听来动人心魄的誓言，如今在回忆里只剩下腐烂发酵的恶臭。", "温见雪撕开第一个黑色垃圾袋，大步走进主卧衣帽间。", "拉开衣柜，整整齐齐挂着三十多套沈淮安的高定西装与羊绒大衣——其中半数以上，是用温见雪去年拿下一项国际空间设计金奖后的奖金给他置办的。", "温见雪甚至连多看一眼的兴致都没有，伸手扯住衣架，哗啦啦一把将整排昂贵的西装全部硬生生拽下，像塞破抹布一样粗暴地塞入黑色垃圾袋中。", "沈淮安用过的领带夹、用她信用卡积分兑换的万宝龙墨水笔、梳妆台上摆着的男士沙龙香水、还有床头柜上沈淮安常年戴着用来装点门面的欧米茄海马手表……", "温见雪拉开抽屉，手臂一扫，所有的东西稀里哗啦全数倾倒进袋子里。", "“卧槽，痛快！”林晚晚在一旁看得拍手称快，“这种脏了的东西，多留一秒都嫌晦气！”", "不过半个小时，四只足足半人高的黑色工业垃圾袋被结结实实地扎紧了封口。", "温见雪打开大门，一手拎着两袋，面无表情地踩着楼梯间步入货梯，径直下到底层垃圾集中处理站。", "“砰——！”", "沉重的塑料袋被狠狠砸入垃圾压缩箱深处。", "夜风吹乱了温见雪额前的碎发，她站在冷雨微飘的垃圾站前，静静看着压缩箱的液压臂轰鸣运转，将沈淮安过去三年来在这里留下的所有痕迹碾成废渣。", "掏出手机，界面上弹出了三十多个未接来电，全部来自同一个号码。", "还有几十条接连轰炸的微信消息：", "【见雪！你听我解释好不好！求你了接电话！】", "【芊芊真的是喝多了，我和她什么都没发生！我和你在一起三年，我的心你难道不知道吗？】", "【城南那个项目不能没有你的图纸，明天沈家的长辈都要来视察，你别跟我任性了好不好？】", "【温见雪！你当着全酒吧人的面泼我酒，我的面子全让你毁了！差不多得了吧，你真要逼死我吗？！】", "字里行间，从最初的虚伪告饶，迅速演变为气急败坏的道德绑架与指责。", "温见雪唇角浮现出一抹彻骨的讥诮。", "看，这就是她爱了整整三年的男人。", "自私、虚伪、懦弱，到了这一刻，脑子里盘算的依然是他的面子和他的项目。", "温见雪指尖轻点，利落地将电话号码拉入永久黑名单，接着在微信通讯录里找到沈淮安的头像，直接点击了“删除联系人”。", "连同两人的情侣空间、备忘录打卡、社交账号关联，在短短三分钟内被彻底清洗干净，仿佛这个人从未在她的生命中存在过。", "随后，温见雪拨通了房东的电话：", "“陈阿姨，打扰了。这套公寓我不续租了，本季度的押金我不要了，明早八点会有保洁和搬家公司入场搬走我的个人设计图纸。退房交接手续，您让中介来办即可。”", "电话那头的房东还想挽留，温见雪已平静地挂断了电话。", "断得干干净净，不留半分余地。", "……", "凌晨零点三十分。", "走廊里突然传来了杂乱而踉跄的脚步声，伴随着剧烈的拍门声！", "“温见雪！开门！你给我把门打开！”", "沈淮安在酒吧狼狈失态后，顾不上换掉那一身湿透腥臭的酒渍衣服，打车一路狂飙赶回公寓。当他看到门锁密码被重置、指纹失效时，整个人瞬间抓狂。", "“见雪！我知道你在里面！”沈淮安双拳狠狠砸在防盗门上，声音嘶哑而崩溃，“你把门开开！三年了！我为了你每天在外面像条狗一样给人敬酒赔笑，我有哪点对不起你？！不就是跟别的女人逢场作戏喝了杯酒吗？你至于这么绝情吗？！”", "门内，林晚晚冷笑着拎起靠在鞋柜旁的一根铝合金棒球棒，上前一步将防盗链挂上，随后猛地拉开了一条门缝。", "门外沈淮安猩红着眼睛就要往里挤，林晚晚手中的金属棒球棒狠狠顶在他的胸膛上，将他硬生生怼退了半步！", "“沈淮安，你嘴巴给我放干净点！”林晚晚目光如刀，“逢场作戏？抱在一起互喂青提、商量着把见雪辛苦跑出来的艺术馆软装送给小三，这也叫逢场作戏？你那身行头、这套房子的房租，哪一样不是见雪掏的心血？你连她脚底下的一块泥巴都比不上！”", "“晚晚！你少在这儿挑拨离间！”沈淮安喘着粗气，狼狈地想要探头往里看，“见雪！见雪你出来！我们当面谈清楚！”", "客厅里，温见雪正坐在沙发上低头整理自己的设计手稿，连眼皮都没抬一下。", "两名身穿制服的大厦高级保安带着巡警快步从电梯里冲出。", "“沈先生，业主温小姐十分钟前已经通过室内安防系统报警。”领头的保安队长面色严厉，一把扣住沈淮安的肩膀，“您现在涉嫌寻衅滋事和非法骚扰，请立刻离开，否则我们将移交派出所依法拘留！”", "“你们放开我！这是我和我女朋友的私事！”沈淮安疯了一样挣扎，皮鞋在光可鉴人的大理石地面上剧烈磨蹭，“见雪！你不能这么对我！沈氏不会放过你的——！”", "保安与巡警毫不留情地将他反剪双手强行拖进电梯，歇斯底里的嚎叫声随着电梯门的闭合终于戛然而止。", "楼道里重新恢复了死一般的沉寂。", "林晚晚重重带上门，啐了一口：“真是晦气！这种癞蛤蟆，多看一眼都反胃。”", "温见雪合上手中的黑色牛皮速写本，神色淡淡地站起身：“晚晚，今晚委屈你陪我在这儿凑合一宿了，明早搬家公司到了，我们就走。”", "“说什么胡话呢，我巴不得你早点踹了这个白眼狼！”林晚晚走上前抱了抱温见雪单薄的肩膀，“今晚我守着你，安心睡吧。”", "温见雪微微抿唇，心头涌起一股暖意。", "正当两人准备洗漱时，大门处再次响起了敲门声。", "这一次，不是暴躁的砸击，而是极有节律的三声轻叩。", "咚、咚、咚。", "沉稳、温和、克制。", "林晚晚一愣，警惕地握紧棒球棒走向猫眼。然而当她看清门外的人影时，整个人瞬间愣住了，随即连忙放下棒球棍拉开大门。", "“江……江医生？！”", "门外站着一道修长清隽的年轻男人。", "男人穿了一件质感极好的深灰色双排扣羊毛大衣，大衣敞开着，里面竟然还穿着一套洗得略显发白的深蓝色外科手术刷手服。", "鼻梁上架着一副银丝眼镜，额前的碎发微润，眼底带着淡淡的血丝，显然是刚从连轴转的高难度手术台上下来的模样。", "正是温见雪的青梅竹马、国内顶尖心胸外科圣手——江景修。", "江景修的手里提着一只雕刻着精致花纹的白瓷保温桶，周身带着消毒水与雨夜凉气混合的微冷气息，但在望向客厅内温见雪的那一瞬，他的眸光却像春水初融般化开了所有的冰霜。", "“见雪。”江景修的声音温润而低柔，像极了深夜电台里最舒缓的大提琴声。", "温见雪愣在原地：“景修？你怎么来了……你今晚不是有一台大血管瘤置换手术吗？”", "“手术十一点四十分结束的。”江景修迈步走进玄关，动作极为自然地将保温桶轻轻搁在玄关案几上，“下了台看到晚晚发的那条朋友圈，我不放心，过来看看你。”", "他顿了顿，目光扫过空荡荡的客厅和地上整齐收纳的设计图纸箱，眼神里掠过一丝心疼，却极其克制地没有多问一句关于沈淮安的细节。", "江景修拧开保温桶，里面顿时飘出一股清甜浓郁的香气：“回来的路上绕去同仁堂抓的药材，亲手煮的雪梨百合红枣饮。你一受气或者赶工就容易胃痉挛，趁热喝两口，暖暖胃。”", "那一缕温热的甜香瞬间在冷寂的客厅里弥漫开来。", "过去三年，沈淮安习惯了温见雪为他洗手作羹汤、为他改方案到天亮；而眼前的这个男人，作为全院乃至全国无数政要名流重金难求一号的神级外科医生，却在下了九个小时手术台后，在雨夜为她洗手熬汤。", "温见雪双手接过瓷碗，指尖触碰到滚烫的碗壁，一路温热蔓延至心底。", "江景修看着她小口小口地喝着汤，清冷的唇角扬起一抹柔和的笑意。", "随后，他从大衣口袋里取出一枚深蓝色的皮革卡套，推到了温见雪手边。", "卡套里，是一张泛着金属光泽的智能门禁卡，以及一把精致的铜制钥匙。", "“这是……？”温见雪疑惑地抬头。", "“江畔的「云栖江境」，二十八楼顶层。”江景修轻声道，“去年买下的一套平层，一直空置着，上周刚通风散味完毕。那里安保严格，闲杂人等连小区大门都进不去，采光极好，朝南的大露台正对着江景，很适合你画设计图。”", "温见雪连忙摆手想要推辞：“景修，这太贵重了，我不能……”", "“见雪，听我说。”", "江景修打断了她的话，他缓缓蹲下身来，视线与坐在沙发上的温见雪平齐。", "隔着近在咫尺的距离，男人清澈深邃的眼眸里，清晰倒映出温见雪孤单的身影。", "他的声音很轻，却带着一种毋庸置疑的坚定：", "“这不是施舍，也不是借住。你从小性子傲，不肯轻易欠人情，但在这个节骨眼上，我不想看到你再为了找房子、防渣男耗费心神。房租按市场价打到我卡里，随你住多久。”", "江景修抬手，似乎想要触碰她的发梢，但手指在半空中微顿了一瞬，最终克制地收了回来，只是温柔地注视着她：", "“二十年前在老弄堂里，我就说过，只要你回头，景修哥永远在你身后。”", "“今晚安心睡一觉。明天太阳升起来，所有的不堪都将留在昨天。”", "温见雪握着温热的瓷碗，眼底终究还是泛起了一层朦胧的薄雾。", "她没有矫情，重重点了点头：“好，景修哥，谢谢你。”", "看着温见雪把红枣汤喝完，江景修眼底的疲倦似乎都消散了几分。他起身整理好大衣：“明天早上八点，我派两辆车过来帮你搬家。我早班还有查房，就不多留了，早点休息。”", "林晚晚送江景修到门口，小声赞叹：“江医生，你今天简直帅呆了！比那个姓沈的狗东西强了一万倍！”", "江景修微微一笑，微微颔首致意，转身迈入电梯。", "而当电梯门合上、步入地下停车场的幽暗光线中时，江景修原本温润如玉的面容，瞬间寸寸凝结成极具压迫感的冰霜。", "他掏出手机，屏幕上闪烁着一条半小时前来自傅氏财阀总裁办的绝密加密短信：", "【江院长，明日上午九点，傅沉舟傅先生将赴贵院进行私人健康咨询。另外，傅先生托我向您打听一位叫温见雪的女士，听闻二位系旧识……】", "江景修指尖微紧，冷白的手背上青筋隐现。", "傅沉舟。", "那个在A市权势滔天、翻云覆雨的首富掌舵人。", "为什么会在今夜突然盯上温见雪？", "江景修眼底闪过一丝极度危险的暗芒，骨节分明的手指利落地回复了两个字：", "【不见。】"], "words": 4131}, {"num": 3, "title": "第003章 义兄的雷霆怒火", "paragraphs": ["翌日清晨，A市核心CBD，高耸入云的裴氏大厦顶层多功能会议室。", "全景落地窗外晨光破晓，照亮了长达十余米的黑胡桃木会议长桌。长桌两侧，正襟危坐着裴氏实业的十二位资深董事与各业务线总裁，气氛肃穆得落针可闻。", "而在会议桌末端，沈淮安与他的父亲沈建山正满脸堆笑、局促地搓着双手。", "沈淮安额头上还贴着一块白色的医用无菌纱布，那是昨晚被保安按在地上摩擦留下的淤青。为了掩盖狼狈，他特意换上了一套笔挺的定制深灰西装，眼神中难掩亢奋与紧张。", "这是沈家今年最重要的一场战役——续签裴氏实业旗下所有高端商业综合体、住宅项目的千万级石材与空间机电供应总包合同。", "只要这份价值八千万的意向书顺利落地，沈氏在家族内部的地位就能稳如泰山，他在狐朋狗友面前也能彻底挺直腰杆。", "沈建山压低声音，狠狠瞪了沈淮安一眼：“昨晚到底怎么回事？听说你在浮光跟人闹了笑话？今天签约关头，可千万别出差错！”", "“爸，您放心，小事一桩，早就摆平了。”沈淮安强撑着笑意，压下心底隐隐的不安。", "在他看来，温见雪不过是在闹小脾气。女人嘛，冷她两天，买个包哄一哄、说几句甜言蜜语，自然又会乖乖回头帮他改图纸。", "正当此时，厚重的实木雕花大门被两名黑西装保镖无声推开。", "一道挺拔冷峻的身影阔步踏入会议厅。", "男人约莫二十七八岁年纪，生了一双极其深邃沉稳的狭长凤眸，高鼻薄唇，五官轮廓深邃得宛如大理石雕刻。他身穿一袭剪裁极为严苛的深墨色定制西服，腕间戴着一块低调内敛的百达翡丽古董机械表，每一步迈出都带着上位者不怒自威的凌厉压迫感。", "裴氏百年商业帝国真正的掌舵人，温见雪名义上的义兄——裴知砚。", "“裴总！”", "“裴总好！”", "全场所有董事与高管瞬间齐刷刷起立致敬。", "沈淮安与沈父更是满脸堆笑，点头哈腰地站起身，沈建山双手捧起那份厚厚的合作合同意向书，语气恭敬到了极点：“裴总，按照咱们上季度的沟通，这是今年下半年八千万的供应链续约草案，法务已经全部核验完毕，就等您亲自过目签字了。”", "裴知砚甚至没有走向主位皮椅。", "他单手插在西裤口袋里，步履沉稳地停在长桌中央，那双幽邃冰冷的眼眸，居高临下地落在了满面谄媚的沈淮安身上。", "会议室内的温度仿佛在这一瞬骤降至冰点。", "裴知砚伸出修长骨感的手指，漫不经心地从桌上捏起了那份厚重的八千万合同文本。", "沈淮安眼中瞬间爆发出贪婪的光彩，连呼吸都急促起来：“裴总，您放心，我们沈家一定用最严苛的标准交付，绝对不会辜负裴氏的信任……”", "刺啦——！", "一声极其刺耳、清脆的撕裂声，毫无预兆地在死寂的会议室中炸响！", "在全场数十位董事与沈家父子惊骇欲绝的注视下，裴知砚面无表情，修长结实的双手微微发力，竟硬生生将那份盖着红章的八千万合同意向书，从正中间撕成了两半！", "刺啦！又是一声裂响！", "八千万的商业合同，在男人冷酷的手指下化作了一地纷飞的碎纸屑！", "“裴……裴总？！”沈建山眼珠子几乎要瞪出眼眶，脸色瞬间煞白，心脏病险些当场发作。", "沈淮安更是如遭雷击，双腿剧烈颤抖，大脑一片空白：“裴总！您这是……这是何意啊？！我们两家合作多年，沈家向来勤勤恳恳，不知沈家到底做错了什么？！”", "裴知砚缓缓转过身，将指间残留的半张碎纸，冷漠而轻蔑地直接甩在了沈淮安煞白的脸上！", "碎纸片划过沈淮安贴着纱布的额头，狼狈飘落一地。", "“何意？”", "裴知砚的声音很低沉，却像重锤一样狠狠砸在每个人的心尖上，震得众人耳膜发麻：", "“沈淮安，昨晚在「浮光」酒吧的VIP卡座里，你左拥右抱、出轨偷情、辱骂正牌女友时的威风劲儿，去哪儿了？”", "轰——！", "沈淮安脑中轰然巨响，整个人仿佛被剥光了扔进数九寒冬的冰窟窿里！", "他怎么也没想到，昨晚隐秘角落里发生的一幕，竟然在短短几个小时内，传到了这位以铁血冷酷著称的商界帝王耳中！", "沈建山一头雾水却也嗅到了灭顶之灾的气息，急忙扬手狠狠抽了沈淮安一个耳光：“畜生！你在外面到底惹了什么滔天大祸？！”", "沈淮安被打得嘴角溢血，惊恐万状地跪倒在地：“裴总！那……那只是我个人的私生活！我和见雪只是一时闹了点误会！这和我们两家的商业合作无关啊！求您高抬贵手！”", "“无关？”", "裴知砚居高临下俯视着宛如烂泥般的沈淮安，薄唇微启，字字如刀：", "“温见雪是我裴知砚的妹妹，是我裴家奉若至宝的掌上明珠。”", "“你算个什么东西，也配踩着她的心血往上爬？也配让她受半点委屈？！”", "全场所有董事与高管心神俱震！", "他们早就知道裴总对当年收养的义妹极其护短珍视，却没想到护短到了如此惊世骇俗的程度——为了替妹妹出气，眼睛都不眨一下直接手撕八千万的成熟合作！", "裴知砚转头看向法务总监与运营副总裁，冷漠下令：", "“通知下去，从这一秒起，裴氏实业旗下所有在建工程、商业地产、投资项目，永久终止与沈氏的一切合作。”", "“同时，对沈家承接的上一期工程启动全面质量与财务审计，任何偷工减料、违规转包之处，移交司法机关顶格追责到底。”", "“在A市，谁敢给沈家一口饭吃，就是和我裴知砚过不去。”", "字字诛心，断绝生路！", "沈建山听到这番话，两眼一黑，捂着胸口直挺挺地瘫倒在红木地板上。", "而沈淮安跪在碎纸堆里，浑身颤抖得如同秋风中的落叶。他终于绝望地意识到，自己失去的不仅仅是一个爱他三年的温柔女人，更是亲手葬送了沈家全部的前途与命运！", "……", "上午九点三十分。", "A市临江最顶级的私密豪宅「云栖江境」，二十八楼顶层大平层。", "晨曦透过二百七十度的环形江景落地窗倾泻而入，江面上波光粼粼，金光万道。", "温见雪身穿一件宽松柔软的米白色羊绒开衫，长发松松挽在脑后，正坐在临江的长桌前聚精会神地绘制新工作室的视觉标识。", "玄关门铃清脆响起。", "温见雪走上前打开门，正对上裴知砚那张英挺深沉的俊颜。", "男人周身带着淡淡的冷冽风尘，但在看见温见雪素面朝天、神色平静的瞬间，眼底所有的暴戾与寒霜彻底消融无踪。", "“知砚哥？你怎么这个时间过来了？”温见雪有些惊讶。", "裴知砚迈步进屋，手里提着一只古色古香的紫砂保温食盒：“路过福禄居，给你带了你小时候最爱吃的金牌水晶虾饺和鲜百合杏仁露。”", "他动作极为自然地将食盒里的早点一一端出摆好，白瓷碟里的小点心晶莹剔透，还冒着热气。", "“趁热吃。”裴知砚拉开椅子，目光沉静而温柔地看着她，“昨晚睡得好吗？”", "“挺好的，景修昨晚送来的红枣茶很管用，睡得很沉。”温见雪咬了一口虾饺，鲜香清甜的味道瞬间在舌尖散开。", "听到“景修”两个字，裴知砚执筷的手指几不可查地微顿了一瞬，眼底掠过一丝深沉的暗涌，但转瞬即逝。", "他从西装内袋里取出一张泛着暗金光泽的纯黑百夫长黑卡，推到温见雪面前。", "“沈家的合同，我刚才在董事会上撕了。”裴知砚语气平淡得像是在说碾死了一只蚂蚁，“这张卡没有额度上限，密码是你的生日。工作室场地、团队招募、前期垫资，想怎么花就怎么花。哥哥在，你只管放手做你想做的事。”", "温见雪看着眼前这张代表着亿万财富的黑卡，心中涌起巨大的温热与触动。", "但她只是轻轻笑了笑，伸出素白的手指，将黑卡推回到了裴知砚面前。", "“知砚哥，收拾沈家，是惩戒小人；但办霁雪，我必须靠我自己的双手。”", "温见雪抬起头，那双清澈如初雪般的眸子里闪烁着坚毅而璀璨的光芒：", "“大学三年，我为了沈淮安收敛锋芒、在幕后替他推演方案；如今走出了泥沼，我要让全A市、全行业的人都看清楚，真正有才华有实力的设计师，到底是谁。”", "“你在我身后，我就有了最大的底气。但路，我要自己走。”", "裴知砚凝视着眼前目光灼灼的少女。", "晨光为她镀上了一层耀眼的金色光晕，自信、明媚、傲骨凛然。", "男人胸膛深处压抑了二十年的滚烫情愫在疯狂翻涌，克制的手指在膝头微微收紧。", "他闭了闭眼，唇角终于扬起一抹发自肺腑的纵容与自豪：“好，既然你决定了，哥哥就做你背后的盾牌。你想飞多高，我都替你护航。”", "……", "与此同时，楼下沿江景观大道旁。", "一辆车牌为纯黑「A·00001」的劳斯莱斯幻影静静停靠在银杏树荫下。", "后排车窗降下半寸，露出一双清冷深邃、戴着银丝半框眼镜的极狭长黑眸。", "傅沉舟修长的指尖轻轻敲击着真皮扶手，目光越过二十八层的玻璃幕墙，定格在阳台上并肩而立的两道身影上。", "驾驶座上的特助恭敬汇报：“傅总，刚才裴氏董事会上，裴知砚当众撕毁了沈家的八千万合同，沈家彻底被行业封杀了。另外……温小姐目前搬进了云栖江境，正是江景修院长的名下私产。”", "傅沉舟垂眸，金丝镜片后掠过一丝令人心惊胆战的低沉冷笑：", "“江景修的房子，裴知砚的黑卡。”", "“温见雪……你身边这几座大山，还真是一个比一个有意思。”", "男人掐灭了指尖的雪茄，薄唇微抿，语调低沉带着不容置疑的霸道：", "“告诉城标项目组，下周一的终审现场，我亲自做主评审。”"], "words": 3379}];

    let currentChapterIndex = 0; // 0-based

    // 渲染指定章节
    function renderChapter(idx) {
      if (idx < 0 || idx >= CHAPTERS.length) return;
      currentChapterIndex = idx;
      const ch = CHAPTERS[idx];

      document.getElementById('cur-chapter-badge').innerText = `CHAPTER ${String(ch.num).padStart(2, '0')}`;
      document.getElementById('cur-chapter-title').innerText = ch.title;
      document.getElementById('cur-chapter-meta').innerText = `字数：${ch.words.toLocaleString()} 字 · 状态：已校阅落盘`;

      const bodyEl = document.getElementById('article-body');
      bodyEl.innerHTML = '';
      ch.paragraphs.forEach((p, i) => {
        const pEl = document.createElement('p');
        if (i === 0) pEl.className = 'first-p';
        pEl.innerText = p;
        bodyEl.appendChild(pEl);
      });

      // 更新翻页按钮状态
      const btnPrev = document.getElementById('btn-prev-chap');
      const btnNext = document.getElementById('btn-next-chap');
      const prevTitle = document.getElementById('prev-chap-title');
      const nextTitle = document.getElementById('next-chap-title');

      if (idx > 0) {
        btnPrev.disabled = false;
        prevTitle.innerText = `‹ 第${idx}章 ${CHAPTERS[idx - 1].title.replace(/^第\d+章\s*/, '')}`;
      } else {
        btnPrev.disabled = true;
        prevTitle.innerText = '前面没有啦';
      }

      if (idx + 1 < CHAPTERS.length) {
        btnNext.disabled = false;
        nextTitle.innerText = `第${idx + 2}章 ${CHAPTERS[idx + 1].title.replace(/^第\d+章\s*/, '')} ›`;
      } else {
        btnNext.disabled = false;
        nextTitle.innerText = '第003章 义兄怒火 (待解锁) ›';
      }

      // 保存阅读位置
      localStorage.setItem('novel_last_chap', idx);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      updateCatalogHighlight();
    }

    function prevChapter() {
      if (currentChapterIndex > 0) {
        renderChapter(currentChapterIndex - 1);
      }
    }

    function nextChapter() {
      if (currentChapterIndex + 1 < CHAPTERS.length) {
        renderChapter(currentChapterIndex + 1);
      } else {
        alert("作者大大正在激情执笔【第003章 义兄的雷霆怒火】中！\n\n裴知砚即将当众撕毁沈家数千万订单，霸气为妹妹撑腰～\n快点下方的爱心按钮给作者发微信催更吧！");
      }
    }

    // 一键切换 浅色 ☀️ / 深色 🌙
    function toggleDarkLight() {
      const currentTheme = document.body.getAttribute('data-theme') || 'dark';
      let target = 'light';
      if (currentTheme === 'light' || currentTheme === 'parchment' || currentTheme === 'ivory') {
        target = 'dark';
      } else {
        target = 'light';
      }
      setTheme(target);
    }

    function updateThemeBtn(theme) {
      const isDark = (theme === 'dark');
      const icon = document.getElementById('quick-theme-icon');
      const text = document.getElementById('quick-theme-text');
      if (isDark) {
        icon.innerText = '☀️';
        text.innerText = '浅色';
      } else {
        icon.innerText = '🌙';
        text.innerText = '深色';
      }
    }

    function setTheme(name) {

      localStorage.setItem('novel_theme', name);

      document.querySelectorAll('.theme-dot').forEach(dot => {
        dot.classList.remove('active');
        if (dot.getAttribute('title') && dot.getAttribute('onclick').includes(name)) {
          dot.classList.add('active');
        }
      });
    }

    // 字号调节
    let currentFontSize = 18;
    function changeFontSize(delta) {
      currentFontSize = Math.max(14, Math.min(26, currentFontSize + delta));
      document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
      document.getElementById('font-size-val').innerText = currentFontSize + 'px';
      localStorage.setItem('novel_fontsize', currentFontSize);
    }

    function setFontFamily(type) {
      if (type === 'serif') {
        document.documentElement.style.setProperty('--font-body', "'Noto Serif SC', 'Songti SC', serif");
      } else {
        document.documentElement.style.setProperty('--font-body', "'Noto Sans SC', sans-serif");
      }
      localStorage.setItem('novel_fontfamily', type);
    }

    // 目录生成与高亮
    function renderCatalog() {
      const listEl = document.getElementById('catalog-list');
      listEl.innerHTML = '';
      CATALOG.forEach(item => {
        const [num, title, desc, isRead] = item;
        const div = document.createElement('div');
        const isCurrent = (num === (currentChapterIndex + 1));
        div.className = `catalog-item${isCurrent ? ' active' : ''}${isRead ? ' ready' : ''}`;
        div.innerHTML = `
          <div>
            <div class="c-title">第${String(num).padStart(3, '0')}章 ${title}</div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">${desc}</div>
          </div>
          <div class="c-badge">${isRead ? '可阅读' : '筹备中'}</div>
        `;
        div.onclick = () => {
          if (num <= CHAPTERS.length) {
            renderChapter(num - 1);
            closeAllDrawers();
          } else {
            alert(`【第 ${num} 章 ${title}】还在火热撰写中！\n\n快对作者说一句‘写第${num}章’，马上为你解锁！`);
          }
        };
        listEl.appendChild(div);
      });
    }

    function updateCatalogHighlight() {
      const items = document.querySelectorAll('.catalog-item');
      items.forEach((item, idx) => {
        if (idx === currentChapterIndex) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    // 人物卡片渲染
    function renderCharacters() {
      const scrollEl = document.getElementById('cast-chips-container');
      const drawerListEl = document.getElementById('cast-detail-list');
      scrollEl.innerHTML = '';
      drawerListEl.innerHTML = '';

      CHARACTERS.forEach(c => {
        // 横向胶囊
        const chip = document.createElement('div');
        chip.className = 'cast-chip';
        chip.innerHTML = `
          <div class="cast-avatar">${c.avatar}</div>
          <div class="cast-info">
            <div class="name">${c.name}</div>
            <div class="tag">${c.tag}</div>
          </div>
        `;
        chip.onclick = () => showCharacterModal(c.name, c.role, c.tag, c.desc);
        scrollEl.appendChild(chip);

        // 抽屉详情卡
        const card = document.createElement('div');
        card.style = 'background: var(--bg-card); padding: 14px; border-radius: 12px; border: 1px solid var(--border);';
        card.innerHTML = `
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px;">
            <span style="font-size: 24px;">${c.avatar}</span>
            <div>
              <span style="font-weight: 700; font-size: 15px;">${c.name}</span>
              <span style="font-size: 12px; color: var(--accent); margin-left: 6px;">${c.role}</span>
            </div>
          </div>
          <div style="font-size: 12px; color: var(--text-secondary); line-height: 1.6;">${c.desc}</div>
        `;
        drawerListEl.appendChild(card);
      });
    }

    function showCharacterModal(name, role, tag, desc) {
      alert(`【${name}】· ${role}\n\n【性格特点】${tag}\n\n【人物背景】${desc}`);
    }

    // 抽屉控制
    function openDrawer(id) {
      closeAllDrawers();
      document.getElementById(id).classList.add('active');
      document.getElementById('drawer-overlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeAllDrawers() {
      document.querySelectorAll('.drawer').forEach(d => d.classList.remove('active'));
      document.getElementById('drawer-overlay').classList.remove('active');
      document.body.style.overflow = '';
    }

    // 滚动进度监听
    window.addEventListener('scroll', () => {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (winScroll / height) * 100;
      document.getElementById('progress-bar').style.width = scrolled + '%';
    });

    // 催更与飘心动效
    const quotes = [
      "收到小仙女的催更啦！作者今晚通宵码第3章！",
      "傅沉舟低沉道：今晚不睡也得给你把下一章写完！",
      "裴知砚默默端来一杯温热的甜牛奶：别看太晚，保护眼睛。",
      "江医生推了推金丝眼镜：听话，喝完红枣雪梨茶早点睡。",
      "顾二少笑着挑眉：为了小仙女的夸奖，立刻安排下一波打脸！",
      "沈淮安还在泥水里下跪呢，马上安排温见雪独立搞事业！"
    ];

    let heartTotal = 1314;
    function triggerHeart(e) {
      heartTotal++;
      document.getElementById('heart-count').innerText = heartTotal;
      localStorage.setItem('novel_hearts', heartTotal);

      // 飘心
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.innerText = ['❤️', '💖', '✨', '🌹', '🥰'][Math.floor(Math.random() * 5)];
      heart.style.left = e.clientX + 'px';
      heart.style.top = e.clientY + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1200);

      // 随机文案
      const msg = quotes[Math.floor(Math.random() * quotes.length)];
      const fBox = document.getElementById('feedback-msg');
      fBox.innerText = msg;
    }

    // 初始化
    window.addEventListener('DOMContentLoaded', () => {
      renderCharacters();
      renderCatalog();

      const savedTheme = localStorage.getItem('novel_theme') || 'dark';
      setTheme(savedTheme);

      const savedSize = localStorage.getItem('novel_fontsize');
      if (savedSize) {
        currentFontSize = parseInt(savedSize);
        document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
        document.getElementById('font-size-val').innerText = currentFontSize + 'px';
      }

      const savedHearts = localStorage.getItem('novel_hearts');
      if (savedHearts) {
        heartTotal = parseInt(savedHearts);
        document.getElementById('heart-count').innerText = heartTotal;
      }

      const lastChap = localStorage.getItem('novel_last_chap');
      const startIdx = (lastChap !== null && lastChap < CHAPTERS.length) ? parseInt(lastChap) : 0;
      renderChapter(startIdx);
    });
  </script>
</body>
</html>
